name: LinearKnot Python packages

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - VERSION
      - LICENSE
      - THIRD_PARTY_NOTICES.md
      - src/**
      - CMakeLists.txt
      - cmake/**
      - python/**
      - .github/workflows/PythonPackage.yml
  pull_request:
    paths:
      - pyproject.toml
      - VERSION
      - LICENSE
      - THIRD_PARTY_NOTICES.md
      - src/**
      - CMakeLists.txt
      - cmake/**
      - python/**
      - .github/workflows/PythonPackage.yml

permissions:
  contents: read

jobs:
  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check release version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(cat VERSION)
          test "$RELEASE_TAG" = "v$version" || test "$RELEASE_TAG" = "$version"
      - name: Build and check source distribution
        run: |
          python -m pip install build twine
          python -m build --sdist --outdir dist
          python python/check_dist.py --version-file VERSION dist/*.tar.gz
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: python-dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  wheels:
    needs: sdist
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    env:
      CIBW_ARCHS: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          name: python-dist-sdist
          path: sdist
      - name: Extract checked source distribution
        run: |
          mkdir package-src
          tar -xzf sdist/*.tar.gz --strip-components=1 -C package-src
      - uses: pypa/cibuildwheel@v4.3.1
        with:
          package-dir: package-src
          output-dir: wheelhouse
      - name: Check wheel payload and metadata
        run: |
          python -m pip install twine
          python python/check_dist.py --version-file VERSION wheelhouse/*.whl
          python -m twine check --strict wheelhouse/*
      - uses: actions/upload-artifact@v7
        with:
          name: python-dist-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    needs: [sdist, wheels]
    if: github.event_name == 'release' && vars.PYPI_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: python-dist-*
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
