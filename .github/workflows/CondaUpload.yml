name: LinearKnot Conda package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v6

      - name: Set package build directory
        run: echo "CONDA_BLD_PATH=$RUNNER_TEMP/conda-bld" >> "$GITHUB_ENV"

      - name: Check release version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(cat VERSION)
          test "$RELEASE_TAG" = "v$version" || test "$RELEASE_TAG" = "$version"

      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          channels: conda-forge
          conda-remove-defaults: true
          channel-priority: strict
          activate-environment: packaging

      - name: Install packaging tools
        run: conda install -y conda-build anaconda-client

      - name: Build and test installed package
        run: conda build ./conda_recipe --croot "$CONDA_BLD_PATH" --no-anaconda-upload

      - name: Save package
        uses: actions/upload-artifact@v7
        with:
          name: linearknot-${{ matrix.os }}
          path: |
            ${{ env.CONDA_BLD_PATH }}/**/linearknot-*.conda
            ${{ env.CONDA_BLD_PATH }}/**/linearknot-*.tar.bz2
          if-no-files-found: error

      - name: Upload release package to configured account
        if: github.event_name == 'release' && vars.ANACONDA_USER != ''
        env:
          ANACONDA_USER: ${{ vars.ANACONDA_USER }}
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
        run: |
          : "${ANACONDA_API_TOKEN:?Set ANACONDA_API_TOKEN for the configured account}"
          package_list=$(conda build ./conda_recipe --croot "$CONDA_BLD_PATH" --output)
          test -n "$package_list"
          while IFS= read -r package; do
            test -f "$package"
            anaconda --token "$ANACONDA_API_TOKEN" upload \
              --user "$ANACONDA_USER" --label main "$package"
          done <<< "$package_list"
